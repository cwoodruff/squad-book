name: Build EPUBs
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Pandoc and epubcheck
        run: |
          sudo apt-get update
          wget -q https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb && sudo dpkg -i pandoc-3.6.4-1-amd64.deb
          sudo apt-get install -y epubcheck
      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli@12.0.0
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          echo "PUPPETEER_CONFIG=/tmp/puppeteer.json" >> "$GITHUB_ENV"
      - name: Coverage check
        run: make coverage
      - name: Manuscript check
        run: make manuscript
      - name: Build and validate both volumes
        run: make validate
      - uses: actions/upload-artifact@v4
        with:
          name: mastering-squad-epubs
          path: |
            dist/mastering-squad-vol1.epub
            dist/mastering-squad-vol2.epub
